name: Build

# Proves the claim in BUILDING.md: a clean clone of this branch configures,
# fetches every dependency, and builds -- with nothing preinstalled beyond what
# the GitHub Windows runner already has.

on:
  push:
    branches: [master, OpenGL, IntelDenoiser]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: ${{ matrix.config }}
    # Pinned rather than windows-latest on purpose. The build needs Visual
    # Studio 2022: CMakePresets.json asks for the "Visual Studio 17 2022"
    # generator, and windows-latest stopped providing an instance CMake could
    # find -- it failed with "could not find any instance of Visual Studio".
    # windows-2022 is the image that carries VS 2022, which is exactly what
    # BUILDING.md tells a human to install.
    #
    # This is the configuration the project is tested on. Newer Visual Studio
    # versions may well work, but nothing here verifies that.
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # No cache on purpose: the point of this job is to exercise the
      # from-scratch path, including the dependency downloads.
      - name: Configure
        run: cmake --preset vs2022

      - name: Build
        run: cmake --build build/vs2022 --config ${{ matrix.config }} --parallel

      - name: Check the executable and its runtime DLLs landed
        shell: pwsh
        run: |
          $dir = "build/vs2022/${{ matrix.config }}"
          foreach ($f in 'WindowsRayTracer.exe', 'OpenImageDenoise.dll', 'tbb.dll', 'tbbmalloc.dll') {
            if (-not (Test-Path "$dir/$f")) { throw "missing $dir/$f" }
          }
          Get-ChildItem $dir | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        if: matrix.config == 'Release'
        with:
          name: WindowsRayTracer-Release
          path: |
            build/vs2022/Release/*.exe
            build/vs2022/Release/*.dll
          if-no-files-found: error
